<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1194 901" width="1194" height="901" role="img" aria-label="Isometric 3D diagram of a five layer stack: edge gateway, orchestration, inference, retrieval, data layer">
<title>Isometric platform architecture</title><desc>Isometric 3D diagram of a five layer stack: edge gateway, orchestration, inference, retrieval, data layer</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#05040E"/><stop offset="55%" stop-color="#0F0C29"/><stop offset="100%" stop-color="#160F33"/>
</linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="hard" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

</defs>
<style>
text { paint-order: stroke; }
@keyframes pulse { 0%,100% { opacity:.30 } 50% { opacity:.95 } }
@keyframes rise { 0% { opacity:0; transform:translateY(14px) } 12% { opacity:1 } 88% { opacity:1 } 100% { opacity:0; transform:translateY(-190px) } }
@keyframes sweep { 0% { opacity:0 } 8% { opacity:.85 } 92% { opacity:.85 } 100% { opacity:0 } }
@keyframes blink { 0%,45% { opacity:1 } 50%,95% { opacity:.15 } 100% { opacity:1 } }
.pulse { animation: pulse 3.4s ease-in-out infinite }
.blink { animation: blink 2.2s steps(1,end) infinite }
.pkt { animation: rise 4.6s linear infinite }
.pkt{animation:rise 4.6s linear infinite}@keyframes rise{0%{opacity:0;transform:translateY(30px)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-330px)}}
</style>
